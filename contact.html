  <div class="container">

    </div>

<main>
  <div class="container">
    <header class="page-title">
      <h1>Contact</h1>
    </header>

    <div class="row">
      <div class="col-md-5">
        <section class="section-block">
          <h2>Details</h2>
          <p class="mb-1">Email: <a href="mailto:YOUR-EMAIL@example.com">YOUR-EMAIL@example.com</a></p>
          <p class="mb-1">GitHub: <a href="https://github.com/Obed09-mugabo">Obed09-mugabo</a></p>
          <p>University: Bugema University, Uganda</p>
        </section>
      </div>

      <div class="col-md-7">
        <section class="section-block">
          <h2>Write to me</h2>
          <p class="texte-doux">This form opens your email app with the message ready to send.</p>
          <form action="mailto:YOUR-EMAIL@example.com" method="post" enctype="text/plain">
            <div class="mb-3">
              <label for="nom" class="form-label">Name</label>
              <input type="text" class="form-control" id="nom" name="name" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
              <label for="sujet" class="form-label">Subject</label>
              <input type="text" class="form-control" id="sujet" name="subject" required>
            </div>
            <div class="mb-3">
              <label for="message" class="form-label">Message</label>
              <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-accent">Send message</button>
          </form>
        </section>
      </div>
    </div>
  </div>
</main>
